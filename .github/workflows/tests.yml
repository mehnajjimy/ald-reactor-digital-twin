name: Reactor tests and package
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      OPENBLAS_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-build-isolation --no-deps -e .
      - run: python -m pytest -q
      - run: node --test tests/workspace.test.cjs
      - run: python -m pip wheel --no-build-isolation --no-deps . --wheel-dir dist
      - run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - name: Check installed examples outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          ald-twin processes
          ald-twin inspect synthetic-zno
          ald-twin inspect synthetic-ab
          ald-twin gui --help
          ald-reactor --help
          python -c "from ald_twin.gui import UI; assert all((UI / name).is_file() for name in ('index.html', 'workspace.js', 'workspace.css', 'audio/click.wav', 'audio/crystal.wav', 'audio/complete.wav'))"
